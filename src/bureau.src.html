<title>Redactie Vechtwaard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
/* Layout: een bureau in POV. Drie monitoren naast elkaar, klik vergroot het scherm tot volle breedte. */
:root{
  --room:#12161b; --room2:#1b2229; --desk:#3b2d24; --desk2:#2a1f19; --glow:#2fb7a3; --amber:#f2b046;
  --ink:#1c2630; --mute:#6b7885; --line:#dde2e7; --paper:#f4f6f8; --brand:#0e6b5e; --brand2:#0a4c43; --alert:#c8382f;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-head:'Space Grotesk','Inter',system-ui,sans-serif; --f-news:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--room);color:#e8eef2;font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font-family:inherit}
.room{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--room2),var(--room) 70%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px 6px}
.brand{font-family:var(--f-head);font-weight:700;letter-spacing:.02em}
.brand small{display:block;font:500 12px var(--f-ui);color:#8fa0ad;letter-spacing:0}
.hint{font-size:13px;color:#8fa0ad}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.photo{position:relative;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.photo img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;pointer-events:none;overflow:hidden;background:#fff;filter:brightness(.95) contrast(1.03);backface-visibility:hidden}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.hs{fill:rgba(47,183,163,0);stroke:rgba(47,183,163,0);stroke-width:5;cursor:pointer;transition:fill .2s,stroke .2s}
.hs:hover{fill:rgba(47,183,163,.20);stroke:#2fb7a3}
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(10,13,16,.78);color:#fff;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;pointer-events:none;white-space:nowrap;backdrop-filter:blur(4px)}
.mon{position:fixed;left:0;top:0;width:100px;height:100px;opacity:0;visibility:hidden;background:#0a0d10;border-radius:10px;padding:10px;pointer-events:none;
  transition:left .42s cubic-bezier(.2,.7,.2,1),top .42s cubic-bezier(.2,.7,.2,1),width .42s cubic-bezier(.2,.7,.2,1),height .42s cubic-bezier(.2,.7,.2,1),opacity .35s}
.mon.zoomed{opacity:1;visibility:visible;z-index:60;pointer-events:auto;box-shadow:0 0 0 2px #232b33,0 30px 80px rgba(0,0,0,.7)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:4px;background:#fff}
.inner{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;transition:transform .42s cubic-bezier(.2,.7,.2,1)}
.bar{position:fixed;left:0;right:0;top:0;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:none;align-items:center;gap:8px;background:rgba(10,13,16,.92);z-index:70;backdrop-filter:blur(6px)}
.bar.on{display:flex}
.bar button{background:#1d252c;color:#e8eef2;border:1px solid #2c3640;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.bar button.cur{border-color:var(--glow);color:#fff}
.bar .sp{flex:1}
.dim{position:fixed;inset:0;background:rgba(5,7,9,.82);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0e6b5e;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){
  body{overflow:auto}
  .room{height:auto;min-height:100%}
}

/* ---------- Scherm 1: redactiesysteem ---------- */
.cms{width:1280px;height:800px;background:var(--paper);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
.cms .hd{height:48px;background:#1f2a33;color:#fff;display:flex;align-items:center;padding:0 20px;gap:14px;flex:none}
.cms .hd b{font-family:var(--f-head);font-size:17px}
.cms .hd span{color:#9fb0bc;font-size:13px}
.cms .hd .r{margin-left:auto}
.cms .body{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr}
.cms .list{border-right:1px solid var(--line);background:#fff;overflow:auto}
.cms .list h3{margin:0;padding:14px 18px;font:600 13px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.cms .it{padding:11px 18px;border-bottom:1px solid #eef1f4;cursor:pointer;display:grid;gap:4px}
.cms .it:hover{background:#f6f9fb}
.cms .it.sel{background:#e6f4f1;box-shadow:inset 3px 0 0 var(--brand)}
.cms .it .t{font-weight:600;line-height:1.3}
.cms .it .m{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#e9edf1;color:#46535f;font-size:11px;font-weight:600}
.pill.ok{background:#d9f0e6;color:#17613f}
.cms .ed{padding:18px 26px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.cms .orig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.cms .orig small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cms .orig p{margin:4px 0 0;color:#46535f;line-height:1.4}
.cms label.l{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.cms label.l span{font-weight:400;color:var(--mute)}
.cms input.kop{width:100%;font:600 20px var(--f-news);padding:11px 14px;border:1px solid #c5cdd5;border-radius:8px;background:#fff;color:var(--ink)}
.cms input.kop:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.img{border:2px solid var(--line);border-radius:8px;background:#fff;padding:6px;cursor:pointer;text-align:left;color:var(--ink);display:grid;gap:6px;font-size:12px}
.img.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,107,94,.18)}
.ph{position:relative;height:70px;border-radius:5px;background:linear-gradient(135deg,#d3dae0,#bcc6ce);display:flex;align-items:center;justify-content:center;color:#6b7885;font-size:12px;overflow:hidden}
.ph .play{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.img .d{line-height:1.25;min-height:30px}
.img .k{color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cms input[type=range]{width:100%;accent-color:var(--brand)}
.time{font:700 26px var(--f-head);color:var(--brand)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);display:grid;gap:5px;justify-items:center}
.seg button.sel{border-color:var(--brand);background:#e6f4f1}
.mini{width:56px;height:34px;border:1px solid #c5cdd5;border-radius:3px;display:grid;grid-template-rows:1.4fr 1fr 1fr;gap:2px;padding:3px;background:#f3f5f7}
.mini i{background:#d3dae0;border-radius:1px}
.mini i.hot{background:var(--brand)}
.cms .go{margin-top:auto;display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.cms .go p{margin:0;flex:1;color:#46535f}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--brand2)}

/* ---------- Scherm 2: website ---------- */
.web{width:1280px;height:800px;background:#fff;color:#1a1f24;font-family:var(--f-ui);overflow:hidden}
.web .mast{background:var(--brand);color:#fff;padding:14px 56px;display:flex;align-items:baseline;gap:18px}
.web .mast b{font:700 36px var(--f-news);letter-spacing:-.01em}
.web .mast span{opacity:.8;font-size:13px}
.web .mast .r{margin-left:auto;opacity:.85}
.web .nav{display:flex;gap:26px;padding:0 56px;border-bottom:1px solid #e1e5e9;font-weight:600;font-size:14px}
.web .nav a{padding:11px 0;color:#37424c}
.web .nav a.on{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.web .main{padding:22px 56px;display:grid;gap:22px}
.web .top2{display:grid;grid-template-columns:2fr 1fr;gap:28px}
.web .hero .ph{height:300px;border-radius:4px;font-size:14px}
.web .hero h1{font:700 32px/1.15 var(--f-news);margin:12px 0 6px}
.web .hero p{margin:0;color:#56626d;font-size:15px}
.web .side h4,.web h4.sec{margin:0 0 10px;font:700 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--brand)}
.web .side li{list-style:none;padding:10px 0;border-bottom:1px solid #eceff2;font:600 16px/1.3 var(--f-news)}
.web .side ul{margin:0;padding:0}
.web .mid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.web .card .ph{height:130px;border-radius:4px}
.web .card h3{font:700 19px/1.2 var(--f-news);margin:8px 0 0}
.web .low{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.web .low div{padding:9px 0;border-bottom:1px solid #eceff2;font:600 16px/1.3 var(--f-news)}
.web .empty{background:repeating-linear-gradient(135deg,#f3f5f7 0 10px,#eef1f3 10px 20px);border-radius:4px;color:#8793a0;display:flex;align-items:center;justify-content:center;font-size:13px;min-height:44px}
.cat{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--brand)}

/* ---------- Scherm 3: resultaten ---------- */
.res{width:1280px;height:800px;background:#0f1720;color:#e6edf3;padding:22px 28px;display:flex;flex-direction:column;gap:16px;font-size:14px}
.res .head{display:flex;align-items:baseline;gap:14px}
.res .head b{font:700 22px var(--f-head)}
.res .head span{color:#8aa0b2}
.res .head .ex{margin-left:auto;background:#3a2d12;color:var(--amber);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#16212d;border-radius:10px;padding:14px 16px}
.kpi small{color:#8aa0b2;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi div{font:700 32px var(--f-head);font-variant-numeric:tabular-nums;margin-top:4px}
.res .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.pan{background:#16212d;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.pan h4{margin:0 0 10px;font:600 13px var(--f-ui);color:#8aa0b2;text-transform:uppercase;letter-spacing:.06em}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{text-align:right;font-weight:600;color:#8aa0b2;font-size:12px;padding:6px 8px;border-bottom:1px solid #263545}
.t td{padding:9px 8px;border-bottom:1px solid #1f2d3b;text-align:right}
.t th:first-child,.t td:first-child{text-align:left}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:#1b2938}
.t tr.row.sel td{background:#1d3446}
.t td.k{max-width:330px;display:flex;align-items:center;gap:6px;font-weight:600}.kt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.tagx{flex:none}
.tagx{font-size:10px;background:#3a2d12;color:var(--amber);padding:1px 6px;border-radius:99px;margin-left:6px;font-weight:600}
.chart{flex:1;min-height:0;display:flex;align-items:flex-end;gap:8px;padding-top:10px;border-bottom:1px solid #263545}
.chart .b{flex:1;background:linear-gradient(var(--glow),#1f8576);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart .b em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:600 11px var(--f-ui);font-style:normal;color:#b9c8d4}
.xl{display:flex;gap:8px;margin-top:6px;color:#8aa0b2;font-size:11px}
.xl span{flex:1;text-align:center}
.pan p.n{color:#8aa0b2;margin:10px 0 0;line-height:1.45}

.cms .url{font:500 12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);background:#eef1f4;border-radius:6px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cms .url b{color:var(--brand);font-weight:600}
.cms .go .btns{display:flex;gap:10px}
.btn.ghost{background:#fff;color:var(--alert);border:2px solid var(--alert);padding:10px 18px}
.btn.ghost:hover{background:#fdecea}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tagx.red{background:#3d1a18;color:#ff8c82}
.chart .b.ev{background:linear-gradient(var(--amber),var(--amber) 5px,var(--glow) 5px,#1f8576)}
.chart .b.off{background:#26333f}
.evlist{display:grid;gap:3px;margin:8px 0 0;color:#cfdbe5;font-size:13px}
.evlist b{color:var(--amber);font-weight:600}
.why{margin-top:10px;display:grid;gap:6px;font-size:12px;color:#aebfcc;overflow:auto}
.why div{display:grid;grid-template-columns:128px 1fr 46px;gap:8px;align-items:baseline;line-height:1.3}
.why b{color:#e6edf3;font-weight:600}
.why .f{text-align:right;font-weight:700;color:#e6edf3;font-variant-numeric:tabular-nums}
.res .pan .chart{min-height:140px}
/*CSS_EXTRA*/
</style>

<div class="room" id="room">
  <div class="top">
    <div class="brand">Redactie Vechtwaard<small>Jouw bureau · afdeling Nieuws</small></div>
    <div class="hint">Klik op een scherm om het te vergroten</div><button class="dbtn" id="docbtn">Docentenmodus</button>
  </div>
  <div class="stage" id="stage"><div class="photo" id="photo">
    <img src="bureau.jpg" alt="Redactiebureau met drie schermen">
    <div class="pv" id="p0"></div><div class="pv" id="p1"></div><div class="pv" id="p2"></div>
    <svg viewBox="0 0 2576 1438" preserveAspectRatio="none">
      <polygon class="hs" data-i="0" points="102,580 926,517 943,898 172,1041"/>
      <polygon class="hs" data-i="1" points="949,518 1658,517 1644,897 963,894"/>
      <polygon class="hs" data-i="2" points="1679,539 2494,605 2431,1049 1664,899"/>
    </svg>
    <div class="lbl" style="left:19%;top:32%">Redactiesysteem</div>
    <div class="lbl" style="left:50.5%;top:33%">Website</div>
    <div class="lbl" style="left:80%;top:33%">Resultaten</div>
  </div></div>
</div>
<div id="layer">
  <div class="mon" data-i="0"><div class="screen"><div class="inner" id="s0"></div></div></div>
  <div class="mon" data-i="1"><div class="screen"><div class="inner" id="s1"></div></div></div>
  <div class="mon" data-i="2"><div class="screen"><div class="inner" id="s2"></div></div></div>
</div>
<div class="dim" id="dim"></div>
<div class="bar" id="bar">
  <button id="back">← Terug naar bureau</button>
  <button data-go="0">Redactiesysteem</button><button data-go="1">Website</button><button data-go="2">Resultaten</button>
  <span class="sp"></span><span class="hint">Esc sluit het scherm</span>
</div>
<div id="docent" hidden></div>
<div class="toast" id="toast"></div>

<!--ENGINE-->
